name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
        # ubuntu-latest is 26.04 now and actions/python-versions ships no 3.9 for it;
        # the oldest supported Python is still checked on Linux, one image back.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Core checks
        run: python test_usage_report.py

      # Both languages must build from the one template. --strict fails when the translation
      # table has drifted, which is the only way the Russian page can silently rot.
      - name: Build the demo in English
        run: python demo/make_demo.py --strict

      - name: Build the demo in Russian
        run: python demo/make_demo.py --lang ru --strict --out demo/index.ru.html

  package:
    # Built on the oldest supported Python, which ubuntu-latest (26.04) no longer has.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - run: python -m pip install --upgrade build
      - run: python -m build

      # Install the wheel somewhere the source tree is not importable, so a missing
      # template.html or i18n/*.json fails here rather than for a user.
      - name: Install the wheel and run it
        run: |
          python -m venv /tmp/env
          /tmp/env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/env/bin/claude-usage-dashboard --help
          /tmp/env/bin/python -c "
          import claude_usage_dashboard.usage_report as ur, os
          for p in (ur.TEMPLATE_PATH, os.path.join(os.path.dirname(ur.__file__), 'i18n', 'ru.json')):
              assert os.path.exists(p), p
          print('packaged assets present')
          "
