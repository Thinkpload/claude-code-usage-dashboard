name: Release

# Publishes to PyPI when a v* tag is pushed. Uses trusted publishing, so there is no API
# token in the repository secrets: PyPI is configured to trust this workflow in this repo.
#
# One-time setup on pypi.org, by the project owner:
#   Your projects -> Publishing -> Add a new pending publisher
#     PyPI project name: claude-usage-dashboard
#     Owner:             Thinkpload
#     Repository:        claude-code-usage-dashboard
#     Workflow name:     release.yml
#     Environment:       pypi
# Then: git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade build
      - run: python -m build

      - name: Refuse to publish a tag that disagrees with the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$pkg" || { echo "tag $tag != pyproject $pkg"; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1
